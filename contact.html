<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Contact Us — NubeTree</title>
  <meta name="description" content="Get in touch with NubeTree by phone, email, or the contact form.">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body class="nt-touch-page">
  <header class="nt-touch-bar">
    <a class="nt-touch-brand" href="index.html">NubeTree</a>
  </header>
  <main class="nt-touch">
    <h1>Get In Touch</h1>
    <ul class="nt-touch-direct">
      <li><a href="tel:+918294236403">+91 8294236403</a></li>
      <li><span>hr@nubetree.com</span></li>
    </ul>
    <form class="nt-touch-form" id="contact-form" action="/api/contact" method="post" novalidate data-state="idle">
      <div id="form-errors" class="nt-form-errors" hidden tabindex="-1">
        <h2 id="form-errors-title">There is a problem</h2>
        <ul></ul>
      </div>
      <div id="form-alert" class="nt-form-errors nt-form-alert" role="alert" hidden tabindex="-1">
        <h2>Your message was not sent</h2>
        <p id="form-alert-text"></p>
      </div>
      <div class="nt-form-grid">
        <div class="nt-field">
          <label for="first-name">First Name<span class="nt-req" aria-hidden="true">*</span></label>
          <input id="first-name" name="firstName" type="text" autocomplete="given-name" maxlength="80" required aria-required="true">
        </div>
        <div class="nt-field">
          <label for="last-name">Last Name<span class="nt-req" aria-hidden="true">*</span></label>
          <input id="last-name" name="lastName" type="text" autocomplete="family-name" maxlength="80" required aria-required="true">
        </div>
        <div class="nt-field">
          <label for="email">Email<span class="nt-req" aria-hidden="true">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="160" required aria-required="true">
        </div>
        <div class="nt-field">
          <label for="phone">Phone<span class="nt-req" aria-hidden="true">*</span></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="40" required aria-required="true">
        </div>
        <div class="nt-field">
          <label for="city">City<span class="nt-req" aria-hidden="true">*</span></label>
          <input id="city" name="city" type="text" autocomplete="address-level2" maxlength="80" required aria-required="true">
        </div>
        <div class="nt-field">
          <label for="state">State/Province<span class="nt-req" aria-hidden="true">*</span></label>
          <input id="state" name="state" type="text" autocomplete="address-level1" maxlength="80" required aria-required="true">
        </div>
        <div class="nt-field nt-field-wide">
          <label for="company">Company</label>
          <input id="company" name="company" type="text" autocomplete="organization" maxlength="160">
        </div>
        <div class="nt-field nt-field-wide">
          <label for="message">Message/Queries<span class="nt-req" aria-hidden="true">*</span></label>
          <textarea id="message" name="message" required aria-required="true" minlength="10" maxlength="4000"></textarea>
        </div>
      </div>
      <p class="nt-hp"><label for="website">Leave this field empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></p>
      <div class="nt-turnstile" id="contact-turnstile" hidden></div>
      <button class="nt-touch-submit" type="submit">Submit</button>
      <p class="nt-touch-note">We'll use these details only to reply to your inquiry.</p>
      <p class="nt-touch-status" id="form-status" role="status" aria-live="polite" hidden></p>
    </form>
    <div class="nt-touch-success" id="contact-success" role="status" aria-live="polite" aria-atomic="true" hidden tabindex="-1" aria-labelledby="contact-success-title">
      <h2 id="contact-success-title">Thanks — your message has been received.</h2>
      <p id="contact-success-text">Our team will get back to you shortly.</p>
      <button class="nt-touch-submit" type="button" id="contact-again">Send another message</button>
    </div>
  </main>
  <script src="assets/turnstile.js"></script>
  <script src="assets/contact/contact-form.js"></script>
</body>
</html>
